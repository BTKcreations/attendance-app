<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sample Timetable</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            background: white;
            color: black;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            border: 2px solid black;
        }

        th,
        td {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }

        th {
            background: #eee;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>College Time Table</h1>
    <table>
        <thead>
            <tr>
                <th>Day / Time</th>
                <th>09:30 - 10:20</th>
                <th>10:20 - 11:10</th>
                <th>11:10 - 12:00</th>
                <th>12:00 - 12:50</th>
                <th>01:30 - 02:20</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>Math</td>
                <td>Physics</td>
                <td>Chemistry</td>
                <td>LUNCH</td>
                <td>Sports</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>History</td>
                <td>English</td>
                <td>Math</td>
                <td>LUNCH</td>
                <td>Library</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>Physics</td>
                <td>Chemistry</td>
                <td>History</td>
                <td>LUNCH</td>
                <td>Math</td>
            </tr>
        </tbody>
    </table>
    <h3 style="margin-top: 50px; color: #555;">Screenshot this area and upload to the App!</h3>
</body>

</html>
