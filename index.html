<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1>My Attendance</h1>
                <p id="current-date">Fetching date...</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="icon-btn" onclick="UI.showSettings()" title="Settings">⚙️</button>
                <div class="live-clock" id="live-clock">--:--</div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">

            <!-- Dashboard View -->
            <section id="view-dashboard" class="view active">
                <div class="attendance-summary">
                    <div class="stat-card">
                        <span class="stat-label">Today</span>
                        <span class="stat-value" id="today-stats">0/0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Streak</span>
                        <span class="stat-value" id="streak-stats">🔥 0</span>
                    </div>
                </div>

                <div class="section-title">
                    <h2>Today's Classes</h2>
                </div>

                <div id="classes-list" class="classes-list">
                    <!-- Cards injected by JS -->
                    <div class="empty-state">
                        <p>No classes scheduled for today.</p>
                        <button class="btn-text" onclick="UI.showModal('add-class-modal')">+ Add Class</button>
                    </div>
                </div>
            </section>

            <!-- History View -->
            <section id="view-history" class="view">
                <div class="section-title">
                    <h2>History</h2>
                </div>
                <div class="history-list" id="history-list">
                    <!-- History items -->
                    <p class="empty-state">No history records yet.</p>
                </div>
            </section>

        </main>

        <!-- Floating Action Button -->
        <button class="fab" id="fab-add" aria-label="Add Class">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active" data-target="view-dashboard">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item" data-target="view-history">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>History</span>
            </a>
        </nav>

        <!-- Add Class Modal -->
        <div id="add-class-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Add New Class</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <form id="add-class-form">
                    <div class="form-group">
                        <label>Class Name</label>
                        <input type="text" id="inp-name" placeholder="e.g. Operating Systems" required>
                    </div>
                    <div class="form-group">
                        <label>Repeat Days</label>
                        <div class="days-selector">
                            <input type="checkbox" id="d-1" value="1" checked><label for="d-1">M</label>
                            <input type="checkbox" id="d-2" value="2" checked><label for="d-2">T</label>
                            <input type="checkbox" id="d-3" value="3" checked><label for="d-3">W</label>
                            <input type="checkbox" id="d-4" value="4" checked><label for="d-4">T</label>
                            <input type="checkbox" id="d-5" value="5" checked><label for="d-5">F</label>
                            <input type="checkbox" id="d-6" value="6"><label for="d-6">S</label>
                            <input type="checkbox" id="d-0" value="0"><label for="d-0">S</label>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Time</label>
                            <input type="time" id="inp-start" required>
                        </div>
                        <div class="form-group">
                            <label>End Time</label>
                            <input type="time" id="inp-end" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Save Class</button>
                </form>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Settings</h3>
                    <button class="close-modal">&times;</button>
                </div>
                <div class="settings-options">
                    <button class="btn-secondary" onclick="UI.handleExport()">📤 Export Data</button>
                    <div style="margin-top: 15px;">
                        <label class="btn-secondary" style="display:block; text-align:center;">
                            📥 Import Data
                            <input type="file" id="import-file" style="display: none;" onchange="UI.handleImport(this)">
                        </label>
                    </div>
                </div>
                <div style="margin-top: 20px; font-size: 0.8rem; color: #64748b; text-align: center;">
                    v2.1
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/timeCheck.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/backfill.js"></script>
    <script src="js/attendance.js"></script>
    <script src="js/ui.js"></script>
</body>

</html>
